[project]
name = "agentic-fx"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "ddgs>=9.15.0",
    "feedparser>=6.0.12",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "trafilatura>=2.1.0",
    "tzdata>=2026.3",
    "yfinance>=1.5.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
afx = "agentic_fx.entry:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_fx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["bench: 長時間ベンチ (既定 skip、-m bench で実行)"]
addopts = "-m 'not bench'"
