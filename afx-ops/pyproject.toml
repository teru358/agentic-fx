[project]
name = "afx-ops"
version = "0.1.0"
description = "agentic-fx の操作 API を使う付属機能 (bot / web / notify) の独立 package"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "aiohttp==3.13.3",
    "discord.py==2.7.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
afx-ops = "afx_ops.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["afx_ops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
